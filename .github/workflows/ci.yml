name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
          enable-cache: true
      - name: Set up development environment
        run: make setup
      - name: Check code and contracts
        run: make check
      - name: Verify distributions and clean core installations
        run: make install-check
      - name: Build container
        run: docker build --tag app-check .
      - name: Verify running container
        run: |
          docker run --rm --network none \
            --mount "type=bind,source=$PWD/tests,target=/verification,readonly" \
            --entrypoint /app/.venv/bin/python app-check /verification/runtime_smoke.py --require-unprivileged
