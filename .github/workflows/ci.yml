name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
          enable-cache: true
      - run: uv sync --frozen --extra server
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run --extra server mypy
      - run: uv run --extra server pytest
      - run: uv run --extra server python scripts/export_openapi.py --check
      - run: uv build
      - run: docker build --tag app-check .
