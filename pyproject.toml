[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "research-bridge-core"
version = "0.1.0"
description = "Evidence-oriented research capabilities"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = ["httpx>=0.28,<1"]


[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.scripts]
research-bridge-ai-api = "research_bridge.api.server:main"
research-bridge = "research_bridge.cli:main"

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "pytest-asyncio>=0.24,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/research_bridge"]
exclude = ["**/README.md"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/contracts", "/pyproject.toml", "/README.md", "/uv.lock", "/.python-version"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
strict = true
